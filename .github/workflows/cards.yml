name: Refresh profile cards

on:
  schedule:
    - cron: '23 2 * * *' # 02:23 UTC / 07:53 India time, daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - render_cards.py
      - requirements.txt
      - assets/**
      - .github/workflows/cards.yml

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install font tools
        run: python -m pip install -r requirements.txt
      - name: Refresh contribution JSON
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
        run: python render_cards.py --refresh
      - name: Render animated SVG cards
        env:
          STATIC: '0'
        run: python render_cards.py
      - name: Commit changed data and cards
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/contributions.json cards README.md assets/fonts
          if git diff --cached --quiet; then
            echo 'Cards are already current.'
            exit 0
          fi
          git commit -m 'Refresh profile cards'
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
